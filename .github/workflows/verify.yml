name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core behavior
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Build universal app
        run: bash scripts/build.sh
      - name: Verify universal architectures
        run: lipo build/Build/Products/Release/StillDock.app/Contents/MacOS/StillDock -verify_arch arm64 x86_64
